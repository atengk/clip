<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clipBg" x1="28" y1="20" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="clipSilver" x1="88" y1="12" x2="168" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="56" y1="64" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadowMain" x="0" y="8" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4F46E5" flood-opacity="0.30"/>
    </filter>
    <filter id="shadowCard" x="30" y="44" width="196" height="196" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- Main Board with DropShadow -->
  <g filter="url(#shadowMain)">
    <rect x="32" y="24" width="192" height="208" rx="36" fill="url(#clipBg)"/>
    <rect x="32.5" y="24.5" width="191" height="207" rx="35.5" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  </g>
  <!-- Back Layer Paper (Tilted slightly) -->
  <rect x="52" y="60" width="152" height="152" rx="18" fill="white" fill-opacity="0.35" transform="rotate(-3 52 60)"/>
  <!-- Front Layer Paper -->
  <g filter="url(#shadowCard)">
    <rect x="52" y="62" width="152" height="154" rx="18" fill="url(#cardGrad)"/>
  </g>
  <!-- Card Content Lines -->
  <rect x="74" y="94" width="56" height="8" rx="4" fill="#4F46E5" fill-opacity="0.9"/>
  <rect x="74" y="114" width="108" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="74" y="128" width="88" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="74" y="142" width="98" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="74" y="156" width="64" height="6" rx="3" fill="#E2E8F0"/>
  <!-- Top Metallic Clip -->
  <rect x="88" y="12" width="80" height="34" rx="10" fill="url(#clipSilver)"/>
  <rect x="88.5" y="12.5" width="79" height="33" rx="9.5" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
  <rect x="108" y="20" width="40" height="14" rx="7" fill="#312E81"/>
</svg>