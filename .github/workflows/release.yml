name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # Stage 1: 创建发布草稿并提取语义化变更日志
  # ============================================================================
  create-draft-release:
    name: 生成发布日志并初始化 Draft Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-draft.outputs.release_id }}
    steps:
      - name: 检出源码 (完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成发布日志 (基于 git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 创建 GitHub Draft Release
        id: create-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_PRERELEASE=$([[ "${{ github.ref_name }}" == *"-"* ]] && echo "true" || echo "false")
          gh release create "${{ github.ref_name }}" \
            --title "Clip ${{ github.ref_name }}" \
            --notes-file CHANGELOG_RELEASE.md \
            --draft \
            --prerelease=$IS_PRERELEASE

          RELEASE_ID=$(gh release view "${{ github.ref_name }}" --json databaseId -q .databaseId)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Stage 2: Windows / macOS / Linux 三平台矩阵并发编译与打包挂载
  # ============================================================================
  build-tauri:
    name: 构建跨平台安装包 (${{ matrix.platform }})
    needs: create-draft-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
            args: ''

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 与 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
        if: hashFiles('pnpm-lock.yaml') != ''

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Linux 系统依赖 (GTK / WebKit / AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        if: runner.os == 'Linux'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建 Tauri 安装包并上传至 Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  # ============================================================================
  # Stage 3: 全平台产物规范化重命名、SHA-256 清单编译与正式发布
  # ============================================================================
  publish-release:
    name: 聚合校验清单并正式发布 Release
    needs: [create-draft-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 规范化全平台产物命名并生成 SHA-256 校验和清单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Target Release Version: ${VERSION}"

          mkdir -p raw-assets normalized-assets
          cd raw-assets
          gh release download "$TAG" --dir .

          for file in *; do
            [ -f "$file" ] || continue
            target=""
            case "$file" in
              *setup.exe|*Setup.exe|*.exe)
                target="Clip-${VERSION}-Windows-x64-Setup.exe"
                ;;
              *.msi)
                target="Clip-${VERSION}-Windows-x64.msi"
                ;;
              *.dmg)
                target="Clip-${VERSION}-macOS-arm64.dmg"
                ;;
              *.app.tar.gz|*darwin*.tar.gz)
                target="Clip-${VERSION}-macOS-arm64.app.tar.gz"
                ;;
              *.AppImage)
                target="Clip-${VERSION}-Linux-x86_64.AppImage"
                ;;
              *.deb)
                target="Clip-${VERSION}-Linux-amd64.deb"
                ;;
              *.rpm)
                target="Clip-${VERSION}-Linux-x86_64.rpm"
                ;;
              checksums.txt)
                continue
                ;;
              *)
                target="$file"
                ;;
            esac

            if [ -n "$target" ]; then
              echo "Mapping: $file -> $target"
              cp "$file" "../normalized-assets/$target"
              if [ "$file" != "$target" ]; then
                echo "Removing unnormalized asset from draft release: $file"
                gh release delete-asset "$TAG" "$file" -y || true
              fi
            fi
          done

          cd ../normalized-assets
          if ls * 1> /dev/null 2>&1; then
            echo "Compiling checksums.txt across normalized assets..."
            sha256sum * > checksums.txt
            sha256sum -c checksums.txt
            gh release upload "$TAG" * --clobber
          else
            echo "Warning: No build assets found to normalize."
          fi

      - name: 将 Draft Release 切换为公开正式发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
