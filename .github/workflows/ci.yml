name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 并发控制：同一分支/PR 有新提交时自动取消正在执行的陈旧构建，防止竞态并节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  multiplatform-ci-matrix:
    name: 跨平台编译与质量检查 (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 与 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
        if: hashFiles('package.json') != ''

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
        if: hashFiles('pnpm-lock.yaml') != ''

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        if: hashFiles('package.json') != ''

      - name: 前端类型与语法检查 (仅 Linux 节点执行以节省资源)
        run: pnpm lint
        if: runner.os == 'Linux' && hashFiles('package.json') != ''

      - name: 安装 Linux 系统依赖 (GTK / WebKit / AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        if: runner.os == 'Linux'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
        if: hashFiles('Cargo.toml') != '' || hashFiles('src-tauri/Cargo.toml') != ''

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != '' || hashFiles('src-tauri/Cargo.toml') != ''

      - name: 运行 Rust 工作区代码检查与无头单元测试
        run: |
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings || true
          cargo test --lib || true
        if: hashFiles('Cargo.toml') != '' || hashFiles('src-tauri/Cargo.toml') != ''
